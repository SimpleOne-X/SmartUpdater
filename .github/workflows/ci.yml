# 主 CI：构建 + 全部测试 + 包内无 .exe 检查 + AOT 冒烟。
# push 到 dev、PR 到 main / dev 触发。不设 paths-ignore：main 要求 build-test 检查通过，
# 检查被路径过滤跳过会一直处于 pending，文档类 PR 就合不进去。
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release --no-incremental -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Pack check (no .exe in the nupkg)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\pack-check\check-no-executables.ps1 -RepoRoot .
      - name: AOT smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\aot-smoke\run-aot-smoke.ps1 -RepoRoot .
